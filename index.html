<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat with Jessica - My Busty Beauty</title>
  <meta name="description" content="Connect with stunning singles near you on My Busty Beauty." />
  <meta name="robots" content="noindex, nofollow" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#09090D',
              card: '#12121A',
              cardLight: '#1A1A26',
              purple: '#8B5CF6',
              pink: '#EC4899',
              deepPurple: '#6D28D9',
              incoming: '#1F1F2C',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          animation: {
            'pulse-glow': 'pulseGlow 2s infinite alternate',
            'bounce-dots': 'bounceDots 1.4s infinite ease-in-out both',
            'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            pulseGlow: {
              '0%': { boxShadow: '0 0 15px rgba(139, 92, 246, 0.3), 0 0 30px rgba(236, 72, 153, 0.1)' },
              '100%': { boxShadow: '0 0 25px rgba(139, 92, 246, 0.6), 0 0 50px rgba(236, 72, 153, 0.3)' }
            },
            bounceDots: {
              '0%, 80%, 100%': { transform: 'scale(0)' },
              '40%': { transform: 'scale(1.0)' }
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(12px) scale(0.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' }
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Custom Scrollbar for Chat Window */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.2);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.4);
    }

    /* Glassmorphism utility */
    .glass-panel {
      background: rgba(18, 18, 26, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-header {
      background: rgba(18, 18, 26, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* Animation delays for typing indicator */
    .dot-1 { animation-delay: -0.32s; }
    .dot-2 { animation-delay: -0.16s; }
    .dot-3 { animation-delay: 0s; }

    /* Respect reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body class="bg-brand-dark text-slate-100 font-sans min-h-screen antialiased flex flex-col justify-center items-center selection:bg-brand-purple selection:text-white p-0 sm:p-4 overflow-x-hidden">

  <!-- Background Glowing Orbs -->
  <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] bg-brand-purple/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-brand-pink/15 rounded-full blur-[140px] pointer-events-none z-0"></div>

  <!-- Main Container -->
  <main class="w-full max-w-md h-screen sm:h-[840px] flex flex-col glass-panel sm:rounded-3xl shadow-2xl relative z-10 overflow-hidden border-0 sm:border border-white/10">

    <!-- Top App Navigation Header -->
    <header class="glass-header px-4 py-3 flex items-center justify-between shrink-0 z-20">
      <div class="flex items-center space-x-3">
        <!-- Profile Picture & Status Ring -->
        <div class="relative shrink-0">
          <img 
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" 
            alt="Jessica profile portrait" 
            class="w-11 h-11 rounded-full object-cover border-2 border-brand-purple/50 shadow-md"
            width="44"
            height="44"
          />
          <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-brand-card rounded-full flex items-center justify-center">
            <span class="w-full h-full bg-emerald-400 rounded-full animate-ping opacity-75"></span>
          </span>
        </div>

        <!-- User Information & Dynamic Location -->
        <div>
          <div class="flex items-center space-x-1.5">
            <h1 class="font-bold text-base tracking-tight text-white leading-none">Jessica, 24</h1>
            <svg class="w-4 h-4 text-blue-400 fill-current" viewBox="0 0 24 24">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
          </div>
          <div class="flex items-center space-x-1 mt-1 text-xs text-slate-400 font-medium">
            <svg class="w-3 h-3 text-brand-purple" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
            </svg>
            <span id="user-location">Active near you</span>
          </div>
        </div>
      </div>

      <!-- Header Center / Right Badge -->
      <div class="flex items-center space-x-2">
        <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-brand-purple/15 text-brand-purple border border-brand-purple/30 uppercase tracking-wider">
          Chat
        </span>
      </div>
    </header>

    <!-- Chat Messages Window -->
    <section 
      id="chat-window" 
      class="flex-1 overflow-y-auto p-4 space-y-3.5 custom-scrollbar relative z-10 flex flex-col"
      aria-label="Conversation window"
    >
      <!-- Time divider -->
      <div class="text-center my-1">
        <span class="text-[10px] uppercase font-bold tracking-widest text-slate-500 bg-white/5 px-3 py-1 rounded-full">Today</span>
      </div>

      <!-- Messages dynamically appended here -->
    </section>

    <!-- Interactive Options Container -->
    <div id="quick-replies" class="px-4 py-2 flex flex-wrap gap-2 shrink-0 z-20 bg-brand-dark/40 border-t border-white/5">
      <!-- Options render dynamically -->
    </div>

    <!-- Conversion CTA Section (Hidden initially until flow completes or user engages) -->
    <section 
      id="cta-card" 
      class="hidden p-4 bg-brand-card/95 border-t border-brand-purple/20 backdrop-blur-xl shrink-0 z-30 animate-fade-in-up"
    >
      <!-- 18+ Age Verification Toggle -->
      <div class="mb-3 flex items-center justify-center space-x-2 cursor-pointer select-none" id="age-toggle-wrapper">
        <input 
          type="checkbox" 
          id="age-checkbox" 
          class="w-4 h-4 rounded border-slate-700 text-brand-purple focus:ring-brand-purple bg-slate-900 cursor-pointer accent-purple-600"
          checked
        />
        <label for="age-checkbox" class="text-xs text-slate-300 font-medium cursor-pointer">
          I confirm I am <span class="text-white font-bold">18 years or older</span>
        </label>
      </div>

      <!-- Primary Action Button -->
      <button 
        id="cta-button"
        onclick="handleCtaClick()"
        class="w-full py-3.5 px-6 rounded-xl font-extrabold text-sm text-white uppercase tracking-wider bg-gradient-to-r from-brand-purple via-pink-600 to-brand-pink hover:opacity-95 active:scale-[0.98] transition-all shadow-lg shadow-brand-purple/30 animate-pulse-glow flex items-center justify-center space-x-2 cursor-pointer"
      >
        <span>CONTINUE TO MY BUSTY BEAUTY</span>
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

      <p class="text-[10px] text-center text-slate-500 mt-2">
        Safe &amp; Discrete • Verified Profiles • 100% Free Registration
      </p>
    </section>

  </main>

  <!-- JavaScript Logic -->
  <script>
    // Configuration & Targets
    const OFFICIAL_OFFER_URL = "https://mybustybeauty.com/landing";

    // Chat Conversation Sequence Definition
    const conversationScript = [
      {
        id: 1,
        sender: 'jessica',
        text: "Hey there! 😊 I noticed you're nearby. What are you up to tonight?",
        delay: 800,
        options: [
          { text: "Hey Jessica! Just relaxing, you?", nextId: 2 },
          { text: "Looking to meet someone fun 😉", nextId: 2 }
        ]
      },
      {
        id: 2,
        sender: 'jessica',
        text: "I was hoping to find someone nice to talk with... and maybe see where things go 💕",
        delay: 1400,
        options: [
          { text: "I'd love to get to know you better!", nextId: 3 },
          { text: "What kind of guys do you like?", nextId: 3 }
        ]
      },
      {
        id: 3,
        sender: 'jessica',
        text: "Awesome! I just set up my full profile on My Busty Beauty. Let's move our chat over there so we can share photos too! 💋",
        delay: 1600,
        options: null // End of conversation -> triggers CTA display
      }
    ];

    // DOM Elements
    const chatWindow = document.getElementById('chat-window');
    const quickRepliesContainer = document.getElementById('quick-replies');
    const ctaCard = document.getElementById('cta-card');
    const ageCheckbox = document.getElementById('age-checkbox');
    const ctaButton = document.getElementById('cta-button');
    const userLocationSpan = document.getElementById('user-location');

    let currentStep = 0;

    // 1. Dynamic Geolocation Detection (FreeIPAPI with Graceful Fallback)
    async function fetchUserLocation() {
      try {
        const response = await fetch('https://freeipapi.com/api/json', { 
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });
        
        if (response.ok) {
          const data = await response.json();
          if (data && data.cityName) {
            userLocationSpan.textContent = `Active in ${data.cityName}`;
            return;
          }
        }
        throw new Error('Invalid IP payload');
      } catch (err) {
        // Fallback to second service if primary fails, else fallback gracefully
        try {
          const fallbackRes = await fetch('https://ipapi.co/json/');
          if (fallbackRes.ok) {
            const fallbackData = await fallbackRes.json();
            if (fallbackData && fallbackData.city) {
              userLocationSpan.textContent = `Active in ${fallbackData.city}`;
              return;
            }
          }
        } catch (e) {
          // Silent fallback
        }
        userLocationSpan.textContent = "Active near you";
      }
    }

    // Helper: Formatted Time
    function getFormattedTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Helper: Scroll Chat to Bottom smoothly
    function scrollToBottom() {
      chatWindow.scrollTo({
        top: chatWindow.scrollHeight,
        behavior: 'smooth'
      });
    }

    // 2. Typing Indicator Component
    function showTypingIndicator() {
      const typingContainer = document.createElement('div');
      typingContainer.id = 'typing-indicator';
      typingContainer.className = 'flex items-end space-x-2 animate-fade-in-up self-start max-w-[80%]';
      typingContainer.innerHTML = `
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" class="w-7 h-7 rounded-full object-cover shrink-0 mb-1 border border-brand-purple/40" />
        <div class="bg-brand-incoming text-slate-300 rounded-2xl rounded-bl-none px-4 py-3 border border-white/5 flex items-center space-x-1.5 shadow-md">
          <div class="w-2 h-2 bg-brand-purple/70 rounded-full animate-bounce-dots dot-1"></div>
          <div class="w-2 h-2 bg-brand-purple/70 rounded-full animate-bounce-dots dot-2"></div>
          <div class="w-2 h-2 bg-brand-purple/70 rounded-full animate-bounce-dots dot-3"></div>
        </div>
      `;
      chatWindow.appendChild(typingContainer);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) indicator.remove();
    }

    // 3. Render Incoming Message (Jessica)
    function appendIncomingMessage(text) {
      removeTypingIndicator();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-end space-x-2 animate-fade-in-up self-start max-w-[85%]';
      msgDiv.innerHTML = `
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" class="w-7 h-7 rounded-full object-cover shrink-0 mb-1 border border-brand-purple/40" />
        <div>
          <div class="bg-brand-incoming text-slate-100 rounded-2xl rounded-bl-none px-4 py-2.5 text-sm leading-relaxed border border-white/10 shadow-md">
            ${text}
          </div>
          <span class="text-[10px] text-slate-500 mt-1 block ml-1 font-medium">${getFormattedTime()}</span>
        </div>
      `;
      chatWindow.appendChild(msgDiv);
      scrollToBottom();
    }

    // 4. Render Outgoing Message (User)
    function appendOutgoingMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-end justify-end space-x-2 animate-fade-in-up self-end max-w-[85%] ml-auto';
      msgDiv.innerHTML = `
        <div class="flex flex-col items-end">
          <div class="bg-gradient-to-r from-brand-purple to-pink-600 text-white rounded-2xl rounded-br-none px-4 py-2.5 text-sm leading-relaxed shadow-lg shadow-brand-purple/20">
            ${text}
          </div>
          <span class="text-[10px] text-slate-500 mt-1 block mr-1 font-medium">${getFormattedTime()}</span>
        </div>
      `;
      chatWindow.appendChild(msgDiv);
      scrollToBottom();
    }

    // 5. Render Interactive Reply Options
    function renderQuickReplies(options) {
      quickRepliesContainer.innerHTML = '';
      if (!options || options.length === 0) {
        revealCTA();
        return;
      }

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-xs font-semibold bg-brand-cardLight/80 hover:bg-brand-purple/20 text-purple-200 border border-brand-purple/30 hover:border-brand-purple transition-all active:scale-95 text-center shadow-sm';
        btn.textContent = opt.text;
        btn.onclick = () => handleUserSelection(opt);
        quickRepliesContainer.appendChild(btn);
      });
    }

    // Handle Option Selection
    function handleUserSelection(option) {
      quickRepliesContainer.innerHTML = '';
      appendOutgoingMessage(option.text);
      
      const nextStepIndex = conversationScript.findIndex(step => step.id === option.nextId);
      if (nextStepIndex !== -1) {
        processStep(nextStepIndex);
      } else {
        revealCTA();
      }
    }

    // Process Conversation Sequence
    function processStep(index) {
      const step = conversationScript[index];
      if (!step) return;

      setTimeout(() => {
        showTypingIndicator();
        
        setTimeout(() => {
          appendIncomingMessage(step.text);
          renderQuickReplies(step.options);
        }, step.delay);

      }, 400);
    }

    // Reveal CTA Card
    function revealCTA() {
      quickRepliesContainer.style.display = 'none';
      ctaCard.classList.remove('hidden');
      scrollToBottom();
    }

    // Age checkbox handler
    ageCheckbox.addEventListener('change', (e) => {
      if (e.target.checked) {
        ctaButton.removeAttribute('disabled');
        ctaButton.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        ctaButton.setAttribute('disabled', 'true');
        ctaButton.classList.add('opacity-50', 'cursor-not-allowed');
      }
    });

    // 6. Primary CTA Redirection preserving URL Query Parameters
    function handleCtaClick() {
      if (!ageCheckbox.checked) return;

      // Extract current window search parameters (UTM, click_id, subid, etc.)
      const currentSearchParams = window.location.search;
      
      let finalTargetUrl = OFFICIAL_OFFER_URL;

      if (currentSearchParams) {
        const hasExistingQuery = OFFICIAL_OFFER_URL.includes('?');
        const separator = hasExistingQuery ? '&' : '?';
        // Strip initial '?' from location.search to avoid duplicate '??'
        finalTargetUrl += separator + currentSearchParams.substring(1);
      }

      window.location.href = finalTargetUrl;
    }

    // Initialize on DOM Load
    window.addEventListener('DOMContentLoaded', () => {
      fetchUserLocation();
      // Start chat sequence
      processStep(0);
    });
  </script>
</body>
</html>
